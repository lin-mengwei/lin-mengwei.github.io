blurb: '<p><em>The BESTEPS Guide</em> is intended to offer early-career economists, especially PhD students, insights from leading researchers on how to take the “best steps” at each key stage of a research project. It can be used for self-learning or for courses on research skills.</p>

  <p>The <em>Guide</em> is based on a series of lectures held at the University of Barcelona (UB) School of Economics under the BESTEPS project, delivered by <strong>Antonio Cabrales</strong>, <strong>Dirk Foremny</strong>, <strong>Albrecht Glitz</strong>, <strong>Libertad González</strong>, <strong>Joan Llull</strong>, <strong>Guillermo Marin</strong>, <strong>Diego Puga</strong>, and <strong>Jenifer Ruiz-Valenzuela</strong>. Each lecture is self-contained and can be read independently. Together, they offer practical and comprehensive guidance on conducting research effectively during the PhD.</p>'
acknowledgements: '<p>BESTEPS (<em>Barcelona Essential Skills Training for Economics PhD Students</em>) is a flagship PhD training project organized at the UB School of Economics and funded by the UB Doctoral School. It is a core component of the training framework of the PhD in Economics program at the University of Barcelona.</p>

  <p>The lecturers generously agreed to publish these notes as a public good, but did not review the draft. We are grateful to the following young economists across fields and from various institutions for carefully reading the draft and providing thoughtful feedback (in alphabetical order): Bastian Bruestle (Zurich), Haochi Chen (Dublin), Zhenghao Chen (UCL), Alessandro Ciardo (Barcelona), Britta Hecker (IAB), Guillermo Martínez (CEMFI), Taoyi Sun (Purdue), Robert Włodarski (Cambridge), Jessie Ziyue Zhu (Maastricht). All remaining errors are our own responsibility.</p>'
volumes:
- number: 1
  title: Set Up Your Research Project
  intro: '<p>The first part of <em>The BESTEPS Guide</em> is designed to support early-career researchers in taking the very first steps of their PhD journey. It focuses on the foundational phase of any research career: setting up a research project. This includes understanding the workflow, finding a promising idea, and developing the mindset and habits with data management and coding practices.</p>

    <p>The three lectures in this volume provide complementary perspectives from three experienced economists: Antonio Cabrales, Libertad González, and Joan Llull. In the <strong>Opening Lecture</strong>, Antonio provides a broad overview of the research process, guiding early-career researchers through each stage and offering essential principles for dealing with uncertainty and maintaining focus. In <strong>Lecture 1</strong>, Libertad zooms in on the very beginning of the journey, giving practical, step-by-step guidance on how to generate questions and formulate research ideas. Finally, in <strong>Lecture 2</strong>, Joan focuses on a core competency of today’s researchers: doing organized and replicable work, and emphasizing the mindset and practices of reproducibility, transparency, and research integrity.</p>

    <p>Volume 1 of <em>The BESTEPS Guide</em> focuses on helping you start and structure a research project. Volume 2 will turn to the research product, exploring how to produce meaningful outputs and communicate research effectively.</p>'
- number: 2
  title: Produce and Communicate Your Research
  intro: '<p>The second volume of <em>The BESTEPS Guide</em> is designed to support early-career researchers in taking the very first steps of their PhD journey. <strong>Volume 2</strong> of <em>The BESTEPS Guide</em> focuses on turning research ideas into clear, credible, and well-communicated research outputs.</p>

    <p>Building on the foundations laid in Volume 1, this volume addresses the skills required to communicate and produce research outputs: visualization, presentation, and writing. In <strong>Lecture 3</strong>, Guillermo Marin and Dirk Foremny discuss how visualization can be used both to think about data and to communicate economic results effectively, moving from general design principles to applied examples in Economics. In <strong>Lecture 4</strong>, Jenifer Ruiz-Valenzuela examines how to present research effectively, covering slide design, rehearsal, and delivery of a talk, as well as other formats of economics presentation. In <strong>Lecture 5</strong>, Albrecht Glitz focuses on how to write a strong Job Market Paper, explaining the role of a JMP and providing writing guidelines. The <strong>Closing Lecture</strong> by Diego Puga reflects on various formats for delivering our research products, providing insights into project selection, evolution, and communication formats.</p>

    <p>The two volumes of <em>The BESTEPS Guide</em> together aim to map out the whole research life-cycle during the PhD journey and provide practical guidance on each critical stage of a research project.</p>'
