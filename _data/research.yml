- title: "Museums Around: Cultural Infrastructure and Educational Outcomes"
  status: "Work in Progress"
  stage: "Job Market Paper - Draft Coming Soon"
  tags: "Economics of Education, Urban Economics, Cultural Economics"
  abstract: "How do local cultural amenities affect educational attainment and choices? Combining administrative records on 8.5 million students in England with geocoded museum openings, I answer this question using a stacked difference-in-differences design. Opening a museum within 2 km of home raises students' rank in upper-secondary exams by 1.5 percentiles, fading with distance, while progression to upper-secondary study is unchanged. Subject choices are also affected by museum themes; history, social-life, and industry museums increase entry into related subjects by over 1 percentage point, and science museums, if anything, reallocate students from other subjects to academic STEM. Cultural infrastructure in the adolescent environment thus shapes what young people achieve and what they study."
  jel: "I24, I26, Z18"
  keywords: "Museums, Educational Attainment, Subject Choices, Cultural Amenities, Neighborhood Effects"
  image1: "/assets/images/research/museum_edu/fig1.png"
  image2: "/assets/images/research/museum_edu/fig2.png"
  section: "wip"


- title: "Penalizing Failures at University"
  status: "Work in Progress"
  stage: "Draft Coming Soon"
  tags: "Economics of Education, Policy Evaluation, Education Finance"
  coauthors: '<a href="https://sites.google.com/site/andreuarenasweb/" target="_blank">Andreu Arenas</a> and <a href="https://sites.google.com/site/ruizvalenjenifer" target="_blank">Jenifer Ruiz-Valenzuela</a>'
  abstract: "How does <b>increasing the cost of failing university modules</b> affect student persistence and academic performance? To answer this question, we exploit a policy shock in Catalonia involving a two-wave increase in tuition fees—first targeting second and subsequent retake attempts, followed by a general fee increase that affected all attempts, including the first. Using a rich dataset from a large public university, we use a difference-in-differences design to compare students fully exposed to the fee increases with those who received fee waivers before and after the fee changes. First, our findings show that both the penalties for module failures and the general fee increase <b>negatively impact student persistence</b>, particularly among <b>part-time and low-performing</b> students, raising concerns about equity. Second, from an efficiency perspective, we find evidence that financial pressure leads students to <b>pass more modules and reduce the number of retakes</b>, although we do not observe significant improvements in grades beyond passing."
  keywords: "Tuition fees, Retake costs, Negative incentives, Higher education"
  jel: "I23, I22, J24, H52, C23"
  presented: '38th ESPE (Naples), 15th IWAEE (Catanzaro), 4th CESC (Barcelona), 1st IEB Public Policies PhD Workshop (Barcelona), 2024 UB PhD Workshop (Barcelona, <i>Best Paper Award</i>)'
  image1: "/assets/images/research/penalizing/fig2.svg"
  image2: "/assets/images/research/penalizing/fig5.svg"
  section: "wip"


